name: Release Mod

on:
  push:
    tags:
      - 'v*' # Triggers on any tag starting with v (e.g., v1.0.0, v2.1.3-beta)

permissions:
  contents: write # Crucial permission allowing the workflow to create releases

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21' # Adjust this to 17 if targeting older Minecraft versions

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Mod with Gradle
        run: ./gradlew build

      - name: Create GitHub Release and Upload Jar
        uses: softprops/action-gh-release@v2
        with:
          # This automatically grabs your compiled jar from the build output directory
          files: build/libs/*-${{ github.ref_name }}.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}